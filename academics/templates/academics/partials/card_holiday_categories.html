<div id="holiday-categories-list" class="space-y-1 max-h-48 overflow-y-auto">
    {% if categories %}
    {% for category in categories %}
    <div class="flex items-center justify-between py-1.5 px-2 rounded-lg bg-base-200/50 group">
        <span class="text-sm">{{ category.name }}</span>
        <button class="btn btn-ghost btn-xs btn-square text-error sm:opacity-0 sm:group-hover:opacity-100 transition-opacity"
                hx-post="{% url 'academics:holiday_category_delete' category.pk %}"
                hx-target="#holiday-categories-list"
                hx-swap="outerHTML"
                hx-confirm="Remove category '{{ category.name }}'? This only works if no holiday uses it.">
            <i class="fa-solid fa-trash-can text-xs"></i>
        </button>
    </div>
    {% endfor %}
    {% else %}
    <p class="text-xs text-base-content/50 text-center py-3">No categories yet.</p>
    {% endif %}
</div>
